[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-mcp"
version = "1.0.1"
description = "MCP server for SEC EDGAR financial data with a manifest-backed 31-tool surface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "fastmcp",
]

[project.urls]
Homepage = "https://github.com/henrysouchien/edgar-mcp"
Documentation = "https://docs.edgarparser.com"
"Hosted API" = "https://www.edgarparser.com"
"MCP Setup" = "https://docs.edgarparser.com/mcp"
"Tool Reference" = "https://docs.edgarparser.com/tools"
Changelog = "https://docs.edgarparser.com/changelog"
Source = "https://github.com/henrysouchien/edgar-mcp"
Issues = "https://github.com/henrysouchien/edgar-mcp/issues"

[project.scripts]
edgar-mcp = "edgar_mcp.server:main"

[tool.hatch.build]
exclude = ["/edgar_mcp/.edgar_mcp_server_*.pid"]

[tool.hatch.build.targets.wheel]
packages = ["edgar_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"_edgar_flat_file_io.py" = "_edgar_flat_file_io.py"

[tool.hatch.build.targets.sdist]
include = ["edgar_mcp/", "pyproject.toml", "README.md", "LICENSE", "server.json"]

[tool.hatch.build.targets.sdist.force-include]
"_edgar_flat_file_io.py" = "_edgar_flat_file_io.py"
